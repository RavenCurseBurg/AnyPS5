name: macOS full

on:
  push:
    branches: [verify/full-macos-ci-intel-control]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    runs-on: macos-26-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 3
      - run: git submodule update --init --recursive --depth 1 --jobs 8
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Compare the proposed and corrected CTest list paths
        run: |
          sw_vers
          uname -m
          ctest --version
          df -h .
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path = Path(".github/macos-full-expected-failures.txt")
          expected = {line for line in path.read_text().splitlines() if line and not line.startswith("#")}
          args = ["ctest", "--test-dir", "build"]
          original = subprocess.run([*args, "-N", "--exclude-from-file", str(path)], capture_output=True, text=True)
          print("Original path exit", original.returncode, original.stderr, flush=True)
          def names(*extra):
              listing = subprocess.check_output([*args, "--show-only=json-v1", *extra])
              return {test["name"] for test in json.loads(listing)["tests"]}
          registered = names()
          selected = names("--exclude-from-file", str(path.resolve()))
          removed = registered - selected
          print(f"Registered {len(registered)}, selected {len(selected)}, excluded {len(removed)}")
          print("Excluded names", sorted(removed))
          print("Absent from the configured test inventory", sorted(expected - registered))
          assert removed == expected & registered
          (Path(os.environ["RUNNER_TEMP"]) / "previously-excluded.txt").write_text("\n".join(sorted(removed)) + "\n")
          PY
      - name: Build the nested JPEG archive and its installed headers
        run: cmake --build build --parallel 5 --target jpeg_turbo_external
      - name: Compare headers selected by the production JPEG decoder before and after the change
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re
          import shlex
          import subprocess

          helper = Path("core/Decoder/Jpeg/CMakeLists.txt")
          fixed = helper.read_bytes()


          def check(label):
              subprocess.run(["cmake","-S",".","-B","build","-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"],check=True)
              entries = json.loads(Path("build/compile_commands.json").read_text())
              entry, = [item for item in entries if item["file"].endswith("/libSceNKWebKitRequirements/Jpeg.cpp")]
              args = shlex.split(entry["command"])
              index = args.index("-o")
              del args[index:index+2]
              args[args.index("-c")] = "-fsyntax-only"
              result = subprocess.run(args+["-H"],cwd=entry["directory"],text=True,capture_output=True)
              headers = sorted({Path(path).resolve() for path in re.findall(r"^\.+ (.+?/(?:jpeglib|jconfig)\.h)$",result.stderr,re.M)})
              bundled = [Path("3rdparty/libjpeg-turbo").resolve(),Path("build/libjpeg-turbo/include").resolve()]
              external = [path for path in headers if not any(root in path.parents for root in bundled)]
              errors = [line for line in result.stderr.splitlines() if "error:" in line]
              print(label, result.returncode, sorted(map(str,headers)), errors, flush=True)
              assert {path.name for path in headers} == {"jpeglib.h","jconfig.h"}, headers
              if label == "parent":
                  assert result.returncode and external and any("min_DCT_scaled_size" in line for line in errors)
              else:
                  assert result.returncode==0 and not external


          try:
              helper.write_bytes(subprocess.check_output(["git","show","301c34ba3e54966380c158bdd8ac905162be03be:"+helper.as_posix()]))
              check("parent")
          finally:
              helper.write_bytes(fixed)
              check("fixed")
          PY
      - name: Build the guest JPEG controls
        if: ${{ !cancelled() }}
        run: cmake --build build --parallel 6 --target guest_nk_req_jpeg_tests guest_nk_req_jpeg_error_state_tests guest_nk_req_jpeg_messages_tests guest_nk_req_jpeg_restart_tests
      - name: Run the guest JPEG tests three times
        if: ${{ !cancelled() }}
        run: ctest --test-dir build -R '^guest_nk_req_jpeg($|_)' --repeat until-fail:3 --no-tests=error --output-on-failure
      - id: build
        if: ${{ !cancelled() }}
        run: cmake --build build --parallel 6 -- -k 8
      - name: Inspect test commands after the proposed default build
        run: |
          python3 - <<'PY'
          import json, subprocess
          tests = json.loads(subprocess.check_output(["ctest", "--test-dir", "build", "--show-only=json-v1"]))["tests"]
          missing = [test["name"] for test in tests if not test.get("command")]
          print(f"{len(missing)} tests without a command out of {len(tests)}. First 20: {missing[:20]}")
          PY
          df -h .
      - name: Run CPU tests
        run: ctest --test-dir build --output-on-failure --timeout 120 --parallel 6 --no-tests=error --exclude-from-file "$GITHUB_WORKSPACE/.github/macos-full-expected-failures.txt" --output-junit "$RUNNER_TEMP/macos-full.xml"
      - name: Recheck the currently excluded tests
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure --timeout 120 --parallel 3 --no-tests=error --tests-from-file "$RUNNER_TEMP/previously-excluded.txt" --output-junit "$RUNNER_TEMP/macos-excluded.xml"
      - name: Keep CTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ctest-results
          path: |
            ${{ runner.temp }}/macos-full.xml
            ${{ runner.temp }}/macos-excluded.xml
          if-no-files-found: ignore
