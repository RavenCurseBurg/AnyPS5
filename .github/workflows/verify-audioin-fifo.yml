name: AudioIn FIFO validation

on:
  push:
    branches: [verify/audioin-opening-fifo-linux]

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 6
          persist-credentials: false
      - name: Check out pinned sources
        run: git submodule update --init --recursive --depth 1 --jobs 6
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxext-dev libxrandr-dev libasound2-dev libpulse-dev
      - name: Build the public AudioIn tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build --parallel 3 --target guest_audio_in_opening_slot_tests guest_audio_in_tests guest_audio_in_errors_tests guest_audio_in_ps4_open_tests guest_audio_in_vmic_miclevel_bounds_tests guest_audio_in_status_reroute_shared_bounds_tests guest_audio_in_device_id_open_bounds_tests
      - name: Run the suite and repeat the FIFO test
        run: |
          ctest --test-dir build -R '^guest_audio_in' --no-tests=error --output-on-failure
          ctest --test-dir build -R '^guest_audio_in_opening_slot$' --no-tests=error --repeat until-fail:8 --output-on-failure
      - name: Verify the old implementation fails the assertion
        run: |
          git show a4ba667ebf66f8e81808b9ce051444ec03fec81c:core/libs/prx/libSceAudioIn/Export.cpp > core/libs/prx/libSceAudioIn/Export.cpp
          cmake --build build --parallel 3 --target guest_audio_in_opening_slot_tests
          if ctest --test-dir build -R '^guest_audio_in_opening_slot$' --no-tests=error --output-on-failure > "$RUNNER_TEMP/old-audioin.log" 2>&1; then
            cat "$RUNNER_TEMP/old-audioin.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/old-audioin.log"
          grep -F 'the opening slot was visible through its previously closed handle' "$RUNNER_TEMP/old-audioin.log"
      - name: Restore the reviewed implementation and repeat
        run: |
          git restore -- core/libs/prx/libSceAudioIn/Export.cpp
          cmake --build build --parallel 3 --target guest_audio_in_opening_slot_tests
          ctest --test-dir build -R '^guest_audio_in_opening_slot$' --no-tests=error --output-on-failure
          git diff --exit-code
