name: Verify shared Apple audio initialization
on:
  push:
    branches: [verify/apple-shared-audio-initialization]
permissions:
  contents: read
jobs:
  toolchains:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile the production FSR option parser with the available Apple SDKs
        run: |
          sw_vers
          cat > "$RUNNER_TEMP/upscale.cpp" <<'CPP'
          #include "core/libs/prx/libSceAgcDriver/Execution/include/UpscaleMode.hpp"
          int main() { return AgcDriver::SelectUpscaleMode("fsr", "1.25").sharpness == 1.25f ? 0 : 1; }
          CPP
          for version in 16.4 26.3 26.2; do
            xcode="/Applications/Xcode_${version}.app/Contents/Developer"
            if [[ -d "$xcode" ]]; then
              if DEVELOPER_DIR="$xcode" xcrun --sdk macosx clang++ -std=c++20 -arch x86_64 -mmacosx-version-min=15.0 -I. "$RUNNER_TEMP/upscale.cpp" -o "$RUNNER_TEMP/upscale" && "$RUNNER_TEMP/upscale"; then
                echo "Xcode $version builds and runs the parser for macOS 15."
              else
                echo "Xcode $version cannot build and run the parser for macOS 15."
              fi
            fi
          done
  audio:
    runs-on: macos-26
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo softwareupdate --install-rosetta --agree-to-license
      - run: git submodule update --init --recursive --depth 1 --jobs 6
      - run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Build the guest libraries and registered audio test binaries
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          selection = "^(guest_audio_(in|out)|audio_(in|out)|apple_shared_audio)"
          inventory = subprocess.check_output(["ctest", "--test-dir", "build", "-N", "-R", selection], text=True, stderr=subprocess.STDOUT)
          missing = {Path(line.removeprefix("Could not find executable ").strip()).name
                     for line in inventory.splitlines() if line.startswith("Could not find executable ")}
          ninja = subprocess.check_output(["ninja", "-C", "build", "-t", "targets", "all"], text=True)
          binaries = [Path(line.split(": ", 1)[0]).name for line in ninja.splitlines()]
          names = sorted(missing | {name for name in binaries if re.match(selection, name) and name.endswith("_tests")})
          assert {"apple_shared_audio_init_tests", "guest_audio_in_tests", "guest_audio_out_tests", "audio_out_initialization_tests"} <= set(names), names
          print(len(names), names, flush=True)
          subprocess.run(["cmake", "--build", "build", "--parallel", "4", "--target", *names], check=True)
          PY
      - name: Validate the selected audio suite and Mach-O linkage
        run: |
          input_library=build/core/libs/libs/unpatched/libSceAudioIn.prx
          otool -L "$input_library"
          nm -u "$input_library" | grep 'InitializeSdlAudio'
          ctest --test-dir build --output-on-failure --timeout 90 --parallel 3 --no-tests=error -R '^(guest_audio_(in|out)|audio_(in|out)|apple_shared_audio)' --output-junit "$RUNNER_TEMP/apple-audio.xml"
      - name: Compare the two guest APIs in both opening orders
        if: always() && hashFiles('build/tests/apple_shared_audio_init_tests') != ''
        run: |
          ctest --test-dir build --no-tests=error --repeat until-fail:5 -R '^apple_shared_audio_' -V
          git fetch --no-tags --depth=1 origin 41a9e4f3209a6cadd2e96c0331040abc718fe402
          git show FETCH_HEAD:core/libs/prx/libSceAudioIn/Export.cpp > core/libs/prx/libSceAudioIn/Export.cpp
          cmake --build build --parallel 4 --target apple_shared_audio_init_tests
          set +e
          ctest --test-dir build --no-tests=error -R '^apple_shared_audio_' -V --output-junit "$RUNNER_TEMP/previous-audio.xml"
          previous=$?
          set -e
          python3 - "$previous" "$RUNNER_TEMP/previous-audio.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          tests = {item.get("name"): item for item in ET.parse(sys.argv[2]).iter("testcase")}
          assert int(sys.argv[1]) != 0, tests
          assert tests["apple_shared_audio_playback-first"].find("failure") is not None
          assert tests["apple_shared_audio_capture-first"].find("failure") is None
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-shared-audio-tests
          path: |
            ${{ runner.temp }}/apple-audio.xml
            ${{ runner.temp }}/previous-audio.xml
          if-no-files-found: ignore
